[project]
name = "session-buddy"
version = "0.1.0"
description = "Search and resume local coding-agent sessions across Claude Code, Codex, and orchestrators."
requires-python = ">=3.11"
dependencies = [
    "textual>=0.89",
]

[project.optional-dependencies]
traycer = [
    "pycrdt>=0.10",
]
semantic = [
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
sb = "session_buddy.cli:main"
session-buddy = "session_buddy.cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
